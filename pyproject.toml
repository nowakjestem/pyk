[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mattermost-rolki"
version = "0.1.0"
description = "Chapter-based YouTube clips with subtitles, Mattermost and S3"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.12,<4", "boto3>=1.40,<2", "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7", "python-dotenv>=1.1,<2", "yt-dlp[default]>=2026.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.1,<2", "ruff>=0.12"]

[project.scripts]
rolki = "rolki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
