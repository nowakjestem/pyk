mattermost:
  url: ${MATTERMOST_URL}
  channel_ids: ${MATTERMOST_CHANNEL_IDS}
  reconnect_seconds: 5
  reconcile_seconds: 60
  health_port: 8089

paths:
  database: data/state.sqlite3
  work_dir: data/work
  output_dir: data/output

asr:
  binary: whisper-cli
  quantizer: whisper-quantize
  model_path: models/ggml-base-q5_0.bin
  # Download the full-precision multilingual model and quantize locally.
  model_url: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
  quantization: q5_0
  language: pl
  threads: 2
  max_chunk_seconds: 300
  timeout_seconds: 7200

video:
  width: 720
  height: 1280
  source_max_height: 1080
  crop_x: 0.5
  crop_y: 0.5
  crf: 23
  preset: veryfast
  fps: 30
  threads: 2
  timeout_seconds: 7200

subtitles:
  font: Lato
  font_size: 42
  primary_color: '#FFFFFF'
  outline_color: '#000000'
  outline: 3
  shadow: 0
  bold: true
  max_lines: 2
  max_chars_per_line: 26
  max_phrase_seconds: 4
  margin_x: 40
  background:
    mode: word # none: bez tła, line: cała linijka, word: aktualne słowo
    color: '#2563EB'
    opacity: 0.85 # 0: przezroczyste, 1: nieprzezroczyste
    padding: 6
  crop:
    alignment: 2
    margin_v: 130
  letterbox:
    alignment: 2
    margin_v: 230

s3:
  endpoint_url: ${S3_ENDPOINT_URL}
  bucket: ${S3_BUCKET}
  region: ${S3_REGION}
  public_base_url: ${S3_PUBLIC_BASE_URL}
  prefix: clips
  retention_days: 30
  addressing_style: auto

limits:
  max_video_seconds: 3600
  max_work_bytes: 8589934592
  min_disk_free_bytes: 5368709120
  min_available_memory_bytes: 805306368
  # CPU-heavy children and controller fit inside the worker's 768 MiB limit.
  min_container_headroom_bytes: 536870912
  failed_retention_hours: 24
  resource_retry_seconds: 60
  download_timeout_seconds: 1800

worker:
  poll_seconds: 5
  shutdown_grace_seconds: 30
